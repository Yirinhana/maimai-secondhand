# 集成测试 profile：连接独立的 maimai_test 库（真实 MySQL，非内存库）。
# 密码从环境变量 MAIMAI_DB_PASSWORD 注入，不写入仓库。
spring:
  datasource:
    url: jdbc:mysql://${MAIMAI_DB_HOST:127.0.0.1}:${MAIMAI_DB_PORT:3307}/maimai_test?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MAIMAI_DB_USER:maimai}
    password: ${MAIMAI_DB_PASSWORD:}

maimai:
  mail:
    provider: capture
    capture-dir: ${MAIMAI_MAIL_CAPTURE_DIR:.local/mail-capture-test}
  payment:
    channel: mock
  upload-dir: ${MAIMAI_UPLOAD_DIR:.local/uploads-test}
