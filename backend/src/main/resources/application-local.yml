# 本地开发专用 profile。明确标识开发环境：
# - 启用开发种子账号（见 DataSeeder）
# - 邮件写入本地捕获目录，不真实发送
# - 支付走隔离的模拟渠道（界面与接口显著标识，不与公网入口共用）
# - 开放 /api/v1/dev/** 调试入口（仅本 profile）
spring:
  datasource:
    url: jdbc:mysql://${MAIMAI_DB_HOST:127.0.0.1}:${MAIMAI_DB_PORT:3307}/maimai?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
  session:
    cookie:
      secure: false
      same-site: lax

server:
  # 本地开发仅监听回环地址，不对局域网暴露
  address: 127.0.0.1

maimai:
  frontend-origin: ${MAIMAI_FRONTEND_ORIGIN:http://127.0.0.1:5173}
  mail:
    provider: capture
  payment:
    channel: mock

logging:
  level:
    com.maimai: debug
