# 候选生产配置：只能由同机Nginx访问；不能用local/test profile公开运行。
server:
  address: 127.0.0.1
  port: ${MAIMAI_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 40
      min-spare: 5
    max-connections: 200
    accept-count: 50
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  session:
    timeout: 7d
logging:
  level:
    root: info
    com.maimai: info
